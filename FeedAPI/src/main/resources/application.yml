server:
  port: ${SERVER_PORT:5004}

spring:
  application:
    name: feed-api
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=FudoDB;trustServerCertificate=true}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:YourStrong!Passw0rd}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      # FeedAPI owns no tables of its own - it reads (read-only) directly from
      # PostAPI's and UserAPI's tables in the shared FudoDB database. ddl-auto
      # MUST stay "validate" (never update/create) here so this service never
      # attempts to create or alter schema it doesn't own; PostAPI/UserAPI are
      # responsible for creating it when they start up independently.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        format_sql: true

jwt:
  secret-key: ${JWT_SECRET_KEY:FudoSuperSecretKeyThatIsAtLeast32CharactersLong!}
  issuer: ${JWT_ISSUER:FudoIdentityAPI}
  audience: ${JWT_AUDIENCE:FudoClients}
  access-token-expiry-minutes: ${JWT_ACCESS_EXPIRY_MINUTES:15}
  refresh-token-expiry-days: ${JWT_REFRESH_EXPIRY_DAYS:30}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    org.springframework.security: INFO
