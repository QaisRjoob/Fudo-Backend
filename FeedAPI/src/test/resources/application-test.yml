spring:
  datasource:
    url: jdbc:h2:mem:feeddb;DB_CLOSE_DELAY=-1;MODE=MSSQLServer
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

jwt:
  secret-key: TestOnlySecretKeyThatIsAtLeast32CharactersLong!
  issuer: FudoIdentityAPI
  audience: FudoClients
