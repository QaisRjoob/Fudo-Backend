spring:
  datasource:
    url: jdbc:h2:mem:interactiondb;DB_CLOSE_DELAY=-1;MODE=MSSQLServer
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

jwt:
  secret-key: TestOnlySecretKeyThatIsAtLeast32CharactersLong!
  issuer: FudoIdentityAPI
  audience: FudoClients
