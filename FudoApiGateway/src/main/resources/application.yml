server:
  port: ${SERVER_PORT:5000}

spring:
  application:
    name: fudo-api-gateway
  cloud:
    gateway:
      routes:
        - id: identity-route
          uri: ${IDENTITY_API_URI:http://localhost:5001}
          predicates:
            - Path=/api/auth/**
        - id: user-route
          uri: ${USER_API_URI:http://localhost:5002}
          predicates:
            - Path=/api/users/**
        - id: post-route
          uri: ${POST_API_URI:http://localhost:5003}
          predicates:
            - Path=/api/posts/**
        - id: feed-route
          uri: ${FEED_API_URI:http://localhost:5004}
          predicates:
            - Path=/api/feed/**
        - id: story-route
          uri: ${STORY_API_URI:http://localhost:5005}
          predicates:
            - Path=/api/stories/**
        - id: interaction-route
          uri: ${INTERACTION_API_URI:http://localhost:5006}
          predicates:
            - Path=/api/interactions/**
        - id: messaging-route
          uri: ${MESSAGING_API_URI:http://localhost:5007}
          predicates:
            - Path=/api/messaging/**,/hubs/**
        - id: notification-route
          uri: ${NOTIFICATION_API_URI:http://localhost:5008}
          predicates:
            - Path=/api/notifications/**

# fudo.gateway.public-prefixes: routes that skip the gateway-level JWT gate entirely,
# matching the original YARP config where only identity-route had no AuthorizationPolicy
# (every other route was "AuthorizationPolicy": "default"). IdentityAPI still enforces
# [Authorize] itself on its own protected endpoints (logout/me/change-password) - the
# gateway just doesn't double-gate that whole path prefix.
fudo:
  gateway:
    public-path-prefixes:
      - /api/auth/
    rate-limit:
      permits-per-window: 100
      window-seconds: 60

jwt:
  secret-key: ${JWT_SECRET_KEY:FudoSuperSecretKeyThatIsAtLeast32CharactersLong!}
  issuer: ${JWT_ISSUER:FudoIdentityAPI}
  audience: ${JWT_AUDIENCE:FudoClients}

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: INFO
