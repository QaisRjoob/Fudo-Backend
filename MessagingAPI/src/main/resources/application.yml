server:
  port: ${SERVER_PORT:5007}

spring:
  application:
    name: messaging-api
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=FudoDB;trustServerCertificate=true}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:YourStrong!Passw0rd}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect

jwt:
  secret-key: ${JWT_SECRET_KEY:FudoSuperSecretKeyThatIsAtLeast32CharactersLong!}
  issuer: ${JWT_ISSUER:FudoIdentityAPI}
  audience: ${JWT_AUDIENCE:FudoClients}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
